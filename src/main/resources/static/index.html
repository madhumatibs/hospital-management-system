<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hospital Management System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-icon"><i class="bi bi-hospital"></i></span><div><strong>CarePoint</strong><small>Hospital Admin</small></div></div><div class="nav-label">WORKSPACE</div><nav id="nav"><button class="nav-item active" data-module="dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</button><button class="nav-item" data-module="patients"><i class="bi bi-people"></i> Patients</button><button class="nav-item" data-module="doctors"><i class="bi bi-person-badge"></i> Doctors</button><button class="nav-item" data-module="departments"><i class="bi bi-building"></i> Departments</button><button class="nav-item" data-module="appointments"><i class="bi bi-calendar2-check"></i> Appointments</button><button class="nav-item" data-module="rooms"><i class="bi bi-door-open"></i> Rooms & Beds</button><button class="nav-item" data-module="medical-records"><i class="bi bi-file-medical"></i> Medical Records</button><button class="nav-item" data-module="reports"><i class="bi bi-bar-chart"></i> Reports</button></nav><div class="sidebar-bottom"><div class="user-chip"><span class="avatar">AD</span><div><strong>Administrator</strong><small>Hospital Admin</small></div></div></div></aside>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script></body></html>
